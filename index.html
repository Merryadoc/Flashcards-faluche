<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Faluche</title>
<style>
  :root {
    --bg: #faf9f5; --surface: #ffffff; --surface-2: #f4f2ea;
    --text: #1a1a1a; --text-2: #6b6b6b; --text-3: #a0a0a0;
    --border: rgba(0,0,0,0.1); --accent: #1a1a1a;
    --create: #5b3a8a; --create-bg: #ece4f7;
    --role: #6b4f1a; --role-bg: #f4eed9;
    --ancien: #4a4a4a; --ancien-bg: #ebebeb;
    --todo: #b08a3a; --todo-bg: #faf0d6;
    --tab-active-bg: #1a1a1a; --tab-active-fg: #faf9f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --surface: #2a2a2a; --surface-2: #262626;
      --text: #f0f0f0; --text-2: #a0a0a0; --text-3: #6b6b6b;
      --border: rgba(255,255,255,0.1); --accent: #f0f0f0;
      --create: #b89dee; --create-bg: #2e2540;
      --role: #d4b870; --role-bg: #3a3220;
      --ancien: #b0b0b0; --ancien-bg: #303030;
      --todo: #e0c47a; --todo-bg: #3a3220;
      --tab-active-bg: #f0f0f0; --tab-active-fg: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.5rem 1rem; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 1.25rem; text-align: center; }
  .fc-wrap { width: 100%; max-width: 640px; }
  .fc-tabs-main {
    display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; justify-content: center;
  }
  .fc-tabs-main button {
    flex: 1; min-width: 130px; padding: 10px 12px; font-size: 13px; font-weight: 500;
    background: var(--surface); color: var(--text); border: 0.5px solid var(--border);
    border-radius: 10px; cursor: pointer; transition: all 0.15s ease;
  }
  .fc-tabs-main button:hover { background: var(--surface-2); }
  .fc-tabs-main button.active {
    background: var(--tab-active-bg); color: var(--tab-active-fg);
    border-color: transparent;
  }
  .fc-tabs-sub {
    display: none; gap: 5px; margin-bottom: 1rem; flex-wrap: wrap; justify-content: center;
  }
  .fc-tabs-sub.visible { display: flex; }
  .fc-tabs-sub button {
    padding: 6px 10px; font-size: 11.5px; font-weight: 500;
    background: var(--surface-2); color: var(--text-2); border: 0.5px solid transparent;
    border-radius: 8px; cursor: pointer; transition: all 0.15s ease;
  }
  .fc-tabs-sub button:hover { color: var(--text); }
  .fc-tabs-sub button.active {
    background: var(--surface); color: var(--text); border-color: var(--border);
  }
  .fc-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 13px; color: var(--text-2); }
  .fc-count { font-weight: 500; color: var(--text); }
  .fc-mode { display: flex; gap: 6px; }
  button { font-family: inherit; font-size: 12px; padding: 6px 10px;
    background: transparent; color: var(--text); border: 0.5px solid var(--border);
    border-radius: 8px; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease; }
  .fc-mode button:hover { background: var(--surface-2); }
  .fc-mode button:active { transform: scale(0.98); }
  .fc-progress { height: 3px; background: var(--surface-2); border-radius: 2px;
    overflow: hidden; margin-bottom: 14px; }
  .fc-progress-bar { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .fc-stage { perspective: 1400px; margin-bottom: 16px; }
  .fc-card { position: relative; width: 100%; min-height: 480px; cursor: pointer;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
  .fc-card.flipped { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden;
    -webkit-backface-visibility: hidden; display: flex; flex-direction: column;
    padding: 1.5rem 1.5rem 2rem; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: 14px; overflow-y: auto; }
  .fc-front { align-items: center; justify-content: center; text-align: center; }
  .fc-back { transform: rotateY(180deg); background: var(--surface-2); }
  .fc-label { font-size: 12px; color: var(--text-2); margin-bottom: 14px;
    letter-spacing: 0.02em; text-align: center; }
  .fc-icon { font-size: 42px; margin-bottom: 14px; }
  .fc-name { font-size: 26px; font-weight: 500; line-height: 1.3; }
  .fc-back-name { font-size: 17px; font-weight: 500; line-height: 1.3;
    text-align: center; margin-bottom: 14px; padding-bottom: 12px;
    border-bottom: 0.5px solid var(--border); }
  .fc-section { margin-bottom: 14px; }
  .fc-section-title { font-size: 11px; color: var(--text-2);
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
  .fc-signif { font-size: 13.5px; line-height: 1.55; }
  .fc-signif ul { margin: 0; padding-left: 18px; }
  .fc-signif li { margin-bottom: 4px; }
  .fc-porteurs { display: flex; flex-wrap: wrap; gap: 6px; }
  .fc-porteur { font-size: 12px; padding: 4px 10px; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: 8px; }
  .fc-porteur.create {
    background: var(--create-bg); color: var(--create);
    border-color: transparent; font-weight: 500;
  }
  .fc-porteur.role {
    background: var(--role-bg); color: var(--role);
    border-color: transparent; font-weight: 500;
  }
  .fc-porteur.ancien {
    background: var(--ancien-bg); color: var(--ancien);
    border-color: transparent; font-style: italic;
  }
  .fc-porteur.todo {
    background: var(--todo-bg); color: var(--todo);
    border-color: transparent; font-style: italic;
  }
  .fc-empty { font-size: 13px; color: var(--text-3); font-style: italic; }
  .fc-hint { text-align: center; font-size: 11px; color: var(--text-3);
    margin-top: auto; padding-top: 10px; }
  .fc-controls { display: flex; gap: 8px; }
  .fc-controls button { flex: 1; padding: 10px 12px; font-size: 14px; }
  .fc-help { margin-top: 16px; text-align: center; font-size: 11px;
    color: var(--text-3); line-height: 1.7; }
  .legend { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
  .legend.create { background: var(--create-bg); color: var(--create); }
  .legend.role { background: var(--role-bg); color: var(--role); }
  .legend.ancien { background: var(--ancien-bg); color: var(--ancien); font-style: italic; }
  .legend.todo { background: var(--todo-bg); color: var(--todo); font-style: italic; }
</style>
</head>
<body>
 
<h1>🎓 Flashcards Faluche</h1>
 
<div class="fc-wrap">
  <div class="fc-tabs-main">
    <button data-cat="decernements" class="active">🏆 Décernements</button>
    <button data-cat="ordres">⚜️ Ordres</button>
    <button data-cat="rubans">🎀 Rubans</button>
    <button data-cat="autres">🪙 Insignes & co</button>
  </div>
 
  <div class="fc-tabs-sub" id="fc-tabs-sub">
    <button data-sub="insignes" class="active">Insignes</button>
    <button data-sub="elus">Insignes d'élus</button>
    <button data-sub="region">Insignes de région</button>
    <button data-sub="sanctions">Sanctions</button>
  </div>
 
  <div class="fc-header">
    <span><span id="fc-cat-label">Décernement</span> <span class="fc-count" id="fc-position">1 / 36</span></span>
    <div class="fc-mode">
      <button id="fc-btn-shuffle">Mélanger</button>
      <button id="fc-btn-reset">Reset</button>
    </div>
  </div>
 
  <div class="fc-progress"><div class="fc-progress-bar" id="fc-bar" style="width: 2.7%;"></div></div>
 
  <div class="fc-stage">
    <div class="fc-card" id="fc-card">
      <div class="fc-face fc-front">
        <div class="fc-label" id="fc-front-label">Décernement</div>
        <div class="fc-icon" id="fc-icon"></div>
        <div class="fc-name" id="fc-name">—</div>
        <div class="fc-hint">Clique pour révéler</div>
      </div>
      <div class="fc-face fc-back">
        <div class="fc-back-name" id="fc-back-name">—</div>
        <div class="fc-section">
          <div class="fc-section-title" id="fc-signif-title">Signification</div>
          <div class="fc-signif" id="fc-signif">—</div>
        </div>
        <div class="fc-section" id="fc-creators-section">
          <div class="fc-section-title">Créateurs</div>
          <div class="fc-porteurs" id="fc-creators"></div>
        </div>
        <div class="fc-section" id="fc-porteurs-section">
          <div class="fc-section-title">Porteurs actuels (<span id="fc-count-porteurs">0</span>)</div>
          <div class="fc-porteurs" id="fc-porteurs"></div>
        </div>
        <div class="fc-section" id="fc-anciens-section">
          <div class="fc-section-title">Anciens porteurs</div>
          <div class="fc-porteurs" id="fc-anciens"></div>
        </div>
        <div class="fc-hint">Clique pour retourner</div>
      </div>
    </div>
  </div>
 
  <div class="fc-controls">
    <button id="fc-prev">← Précédent</button>
    <button id="fc-flip">Retourner</button>
    <button id="fc-next">Suivant →</button>
  </div>
 
  <div class="fc-help">
    Raccourcis : <strong>Espace</strong> retourne · <strong>←/→</strong> navigue · <strong>S</strong> mélange<br>
    Légende :
    <span class="legend create">Créateur</span> ·
    <span class="legend role">Rôle</span> ·
    <span class="legend ancien">Ancien</span> ·
    <span class="legend todo">Non résolu</span>
  </div>
</div>

function isTodo(s) {
  if (typeof s !== 'string') return false;
  return s.startsWith('+ ') || s.includes('(non résolu');
}
 
function countItems(arr) {
  let total = 0;
  arr.forEach(n => {
    const txt = typeof n === 'string' ? n : n.name;
    const m = txt.match(/\+ (\d+)/);
    if (m) total += parseInt(m[1]);
    else total += 1;
  });
  return total;
}

  let labelData;
  if (currentCat === 'autres') {
    source = ALL_DATA.autres.sub[currentSub];
    labelData = source;
  } else {
    source = ALL_DATA[currentCat];
    labelData = source;
  }
  deck = source.cards.slice();
  elCatLabel.textContent = labelData.label;
  elFrontLabel.textContent = labelData.label;
  elSignifTitle.textContent = (currentCat === 'ordres') ? 'Représentation' : 'Signification';
  index = 0;
  render();
}
 
function render() {
  const c = deck[index];
  elIcon.textContent = c.icon || '';
  elIcon.style.display = c.icon ? '' : 'none';
  elName.textContent = c.nom;
  elBackName.textContent = (c.icon ? c.icon + ' ' : '') + c.nom;
 
  // Signif (string ou array)
  if (Array.isArray(c.signif)) {
    if (c.signif.length === 1) {
      elSignif.textContent = c.signif[0];
    } else {
      const ul = document.createElement('ul');
      c.signif.forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        ul.appendChild(li);
      });
      elSignif.innerHTML = '';
      elSignif.appendChild(ul);
    }
  } else {
    elSignif.textContent = c.signif;
  }
 
  // Créateurs
  elCreators.innerHTML = '';
  if (!c.createurs || c.createurs.length === 0) {
    elCreatorsSection.style.display = 'none';
  } else {
    elCreatorsSection.style.display = '';
    c.createurs.forEach(n => {
      const span = document.createElement('span');
      span.className = isTodo(n) ? 'fc-porteur todo' : 'fc-porteur create';
      span.textContent = n;
      elCreators.appendChild(span);
    });
  }
 
  // Porteurs
  elPorteurs.innerHTML = '';
  const totalPorteurs = countItems(c.porteurs || []);
  elCountPorteurs.textContent = totalPorteurs;
  if (!c.porteurs || c.porteurs.length === 0) {
    const span = document.createElement('span');
    span.className = 'fc-empty';
    span.textContent = 'Aucun porteur actuel';
    elPorteurs.appendChild(span);
  } else {
    c.porteurs.forEach(p => {
      const span = document.createElement('span');
      const isObj = typeof p === 'object';
      const txt = isObj ? p.name : p;
      const role = isObj ? p.role : null;
      if (isTodo(txt)) {
        span.className = 'fc-porteur todo';
        span.textContent = txt;
      } else if (role) {
        span.className = 'fc-porteur role';
        span.textContent = role + ' : ' + txt;
      } else {
        span.className = 'fc-porteur';
        span.textContent = txt;
      }
      elPorteurs.appendChild(span);
    });
  }
 
  // Anciens
  elAnciens.innerHTML = '';
  if (!c.anciens || c.anciens.length === 0) {
    elAnciensSection.style.display = 'none';
  } else {
    elAnciensSection.style.display = '';
    c.anciens.forEach(a => {
      const span = document.createElement('span');
      const isObj = typeof a === 'object';
      const txt = isObj ? a.name : a;
      const role = isObj ? a.role : null;
      if (isTodo(txt)) {
        span.className = 'fc-porteur todo';
        span.textContent = txt;
      } else if (role) {
        span.className = 'fc-porteur ancien';
        span.textContent = role + ' : ' + txt;
      } else {
        span.className = 'fc-porteur ancien';
        span.textContent = txt;
      }
      elAnciens.appendChild(span);
    });
  }
 
  elPos.textContent = (index + 1) + ' / ' + deck.length;
  elBar.style.width = Math.round(((index + 1) / deck.length) * 100) + '%';
  flipped = false;
  elCard.classList.remove('flipped');
}
 
function flip() { flipped = !flipped; elCard.classList.toggle('flipped', flipped); }
function next() { index = (index + 1) % deck.length; render(); }
function prev() { index = (index - 1 + deck.length) % deck.length; render(); }
 
function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  render();
}
 
function reset() { loadDeck(); }
 
function switchCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.fc-tabs-main button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  if (cat === 'autres') {
    elTabsSub.classList.add('visible');
  } else {
    elTabsSub.classList.remove('visible');
  }
  loadDeck();
}
 
function switchSub(sub) {
  currentSub = sub;
  document.querySelectorAll('.fc-tabs-sub button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.sub === sub);
  });
  loadDeck();
}
 
// Bindings
elCard.addEventListener('click', flip);
document.getElementById('fc-flip').addEventListener('click', function(e) { e.stopPropagation(); flip(); });
document.getElementById('fc-next').addEventListener('click', next);
document.getElementById('fc-prev').addEventListener('click', prev);
document.getElementById('fc-btn-shuffle').addEventListener('click', shuffle);
document.getElementById('fc-btn-reset').addEventListener('click', reset);
 
document.querySelectorAll('.fc-tabs-main button').forEach(btn => {
  btn.addEventListener('click', () => switchCat(btn.dataset.cat));
});
document.querySelectorAll('.fc-tabs-sub button').forEach(btn => {
  btn.addEventListener('click', () => switchSub(btn.dataset.sub));
});
 
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 's' || e.key === 'S') shuffle();
});
 
// Init
loadDeck();
</script>
</body>
</html>
